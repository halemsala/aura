version: 1.1.0
product: AURA QUANT-X
updated: '2026-09-05'
policy:
  paper_trade: true
  execution_allowed: false
  advisory_only: true
failure_modes:
- id: FM-ENGINE-001
  title: Engine offline (porta 8765 sem resposta)
  severity: critical
  service: engine
  category: availability
  symptom: Painel mostra Engine OFF; curl em 8765 falha; Side Panel sem análise
  detect:
    method: http_health
    endpoint: http://127.0.0.1:8765/api/health
    port: 8765
    expect: online status 200
  likely_causes:
  - Processo engine não iniciado
  - venv/python quebrado ou path errado
  - Porta 8765 ocupada por outro processo
  - Crash no boot (ver runtime_engine.log)
  repair_steps:
  - Rodar status/diagnóstico e confirmar porta 8765
  - Executar RECUPERAR_AURA_SERVICOS.bat (ou .ps1)
  - 'Se persistir: AURA_INICIAR_SISTEMA.bat como admin'
  - Ler engine/runtime_engine.log e install_run.log
  verify:
  - GET http://127.0.0.1:8765/api/health → 200
  - GET http://127.0.0.1:8765/api/status com paper_trade true
  official_tools:
  - RECUPERAR_AURA_SERVICOS.bat
  - DIAGNOSTICO_AURA.bat
  - AURA_INICIAR_SISTEMA.bat
  lab_safe: true
  injection_hint: 'No LAB: não subir o engine ou bind em porta dummy; nunca no sistema de uso'
  tags:
  - engine
  - offline
  - port-8765
  references:
  - MANUAL §3.3
  - AUDITORIA_ERROS_ENGINE_OFF
- id: FM-ENGINE-002
  title: Engine responde mas /api/ui/state sem view.home / corner_events
  severity: high
  service: engine
  category: data_integrity
  symptom: Engine ON, porém painel vazio ou 'sem dados de jogo'
  detect:
    method: ui_state
    endpoint: http://127.0.0.1:8765/api/ui/state
    expect: view.home e corner_events presentes quando houver partida
  likely_causes:
  - Sem telemetria da extensão (SokkerPro fechado ou aba inativa)
  - Captura stale >45s
  - Fixture não identificado
  repair_steps:
  - Abrir SokkerPro ao vivo e manter aba ativa
  - Recarregar extensão em chrome://extensions
  - Checar POST /api/telemetry e logs da Bridge
  - Confirmar freshness no diagnostic deep
  verify:
  - ui/state com fixture e eventos recentes
  - Captura freshness < 45s
  official_tools:
  - DIAGNOSTICO_AURA.bat
  - VALIDAR_AURA_QUANT_X.bat
  lab_safe: true
  injection_hint: 'LAB: enviar telemetry vazia ou timestamp antigo'
  tags:
  - engine
  - ui-state
  - telemetry
  references:
  - MANUAL fluxo ao vivo
  - skill aura-quant-x health
- id: FM-ENGINE-003
  title: BLOCKED_BY_DATA / data integrity bloqueando sinal
  severity: medium
  service: data
  category: data_integrity
  symptom: Sistema online mas sinal em BLOCK; motivo data_integrity / conflito de escanteios
  detect:
    method: composite
    notes: analysis.decision ou risk_gate com BLOCKED_BY_DATA / data_integrity
  likely_causes:
  - Estatísticas de corners ≠ eventos
  - Payload com valores negativos ou fixture incompleto
  - Fonte autoritativa em conflito (fail-closed)
  repair_steps:
  - Não forçar sinal; respeitar fail-closed
  - Inspecionar data_integrity no /api/analysis/<fixtureId>
  - Reabrir partida / reenviar telemetry limpa
  - Registrar no lab o payload que causou o block
  verify:
  - Novo analysis sem conflito autoritativo
  - paper_trade e execution_allowed inalterados
  official_tools:
  - VALIDAR_AURA_TESTES.bat
  lab_safe: true
  injection_hint: 'LAB: POST telemetry com corners stats ≠ events'
  tags:
  - blocked-by-data
  - fail-closed
  - integrity
  references:
  - MANUAL 3.9
  - RISK_GATES
- id: FM-BRIDGE-001
  title: Bridge offline ou GET /health = 501
  severity: critical
  service: bridge
  category: availability
  symptom: Bridge OFF; feed não grava; REG não gera
  detect:
    method: http_health
    endpoint: http://127.0.0.1:8080/health
    port: 8080
    expect: 200 (não 501)
  likely_causes:
  - server.py sem do_GET / rota /health
  - Processo bridge não iniciado
  - Porta 8080 ocupada
  repair_steps:
  - Confirmar do_GET e rota /health no bridge/server.py
  - RECUPERAR_AURA_SERVICOS.bat
  - 'Smoke: python bridge/server.py e curl /health'
  - Ler bridge/runtime_bridge.log
  verify:
  - GET http://127.0.0.1:8080/health → 200
  official_tools:
  - RECUPERAR_AURA_SERVICOS.bat
  - AURA_PRECHECK_PACOTE.bat
  lab_safe: true
  injection_hint: 'LAB: subir bridge sem do_GET ou não subir'
  tags:
  - bridge
  - health-501
  - port-8080
  references:
  - skill aura-quant-x bugs de campo
  - precheck do_GET
- id: FM-BRIDGE-002
