  - Testar POST /api/cornerai/feed com payload mínimo
  - Checar CORNERAI_BRIDGE_TOKEN se habilitado
  verify:
  - Nova linha em live_feed.jsonl
  - REG recente em bridge/regs/
  official_tools:
  - DIAGNOSTICO_AURA.bat
  lab_safe: true
  injection_hint: 'LAB: não enviar feed; ou token errado'
  tags:
  - bridge
  - feed
  - reg
  references:
  - MANUAL §3.2
